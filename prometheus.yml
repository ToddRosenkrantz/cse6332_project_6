global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ---------------- Kafka ----------------
  - job_name: 'kafka-jmx'
    static_configs:
      - targets: ['kafka:7071']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  # ---------------- S3 (SeaweedFS) ----------------
  - job_name: 'seaweedfs'
    static_configs:
      - targets: ['seaweedfs:9327']
        # the official SeaweedFS dashboard filters on a cluster label
        labels: {cluster: 'cse6332'}

  # ---------------- Spark ----------------
  # The four Spark UI ports below are rewritten from .env by `python setup.py up`
  # (SPARK_MASTER_UI_PORT, SPARK_WORKER_UI_PORT, SPARK_JSON_UI_PORT, SPARK_PARQUET_UI_PORT):
  # each Spark UI listens on the same port inside and outside its container.
  - job_name: 'spark-master'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark-master:8080']

  - job_name: 'spark-worker'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark-worker:8081']

  - job_name: 'spark-consumer-json-driver'
    metrics_path: /metrics/driver/prometheus
    static_configs:
      - targets: ['spark-consumer-json:4041']
        labels: {sink: 'json'}

  - job_name: 'spark-consumer-parquet-driver'
    metrics_path: /metrics/driver/prometheus
    static_configs:
      - targets: ['spark-consumer-parquet:4042']
        labels: {sink: 'parquet'}

  - job_name: 'spark-consumer-json-executors'
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ['spark-consumer-json:4041']
        labels: {sink: 'json'}

  - job_name: 'spark-consumer-parquet-executors'
    metrics_path: /metrics/executors/prometheus
    static_configs:
      - targets: ['spark-consumer-parquet:4042']
        labels: {sink: 'parquet'}

  # ---------------- Containers ----------------
  # Down (not an error) when cAdvisor is disabled.
  - job_name: 'cadvisor'
    scrape_interval: 10s
    # cAdvisor stamps samples with its own time; Prometheus never marks such series stale,
    # so a removed container kept showing its last value for 5 minutes (double counts after
    # every restart). Scrape-time timestamps let a vanished container disappear at once.
    honor_timestamps: false
    static_configs:
      - targets: ['cadvisor:8080']

  # ---------------- Producers (run on the host) ----------------
  # kafka-python producer (--impl kp)
  - job_name: 'kafka-producer-json'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:9108']
        labels: {impl: 'kp'}

  - job_name: 'kafka-producer-parq'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:9109']
        labels: {impl: 'kp'}

  # confluent-kafka producer (--impl ck)
  - job_name: 'kafka-producer-json-ckafka'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:9118']
        labels: {impl: 'ckafka'}

  - job_name: 'kafka-producer-parq-ckafka'
    scrape_interval: 2s
    static_configs:
      - targets: ['host.docker.internal:9119']
        labels: {impl: 'ckafka'}
