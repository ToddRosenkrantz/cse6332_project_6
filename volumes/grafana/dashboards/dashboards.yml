apiVersion: 1

providers:
  - name: 'Pipeline Dashboards'
    orgId: 1
    folder: 'CSE 6332 Pipeline'
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true            # UI edits persist in the (fresh) grafana.db
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
